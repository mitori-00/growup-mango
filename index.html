<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grow Up Mango &amp; Tori</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
    <div class="title" id="device-title">GROW UP MANGO</div>

    <!-- 홈 화면 -->
    <div id="home-screen" class="screen theme-default">
        <div class="theme-decor" id="theme-decor" aria-hidden="true"></div>

        <div class="top-row">
            <div class="level-text" id="level-display">LV.01 (BABY)</div>
            <div class="top-actions">
                <button type="button" class="icon-btn" id="char-btn" title="캐릭터 선택 (망고/토리)">🐾</button>
                <button type="button" class="icon-btn" id="dex-btn" title="도감">📖</button>
                <button type="button" class="icon-btn" id="sound-toggle-btn" title="효과음 켜기/끄기">🔊</button>
                <button type="button" class="coin-shop-btn" id="coin-shop-btn" title="상점 열기">
                    <span>🪙</span>
                    <span id="coin-display">0</span>
                    <span class="shop-tag">SHOP</span>
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-bar">
                <div class="stat-label">HUNGER</div>
                <div class="bar-bg"><div class="bar-fill" id="hunger-bar" style="width: 70%;"></div></div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">HAPPY</div>
                <div class="bar-bg"><div class="bar-fill" id="happy-bar" style="width: 70%;"></div></div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">FATIGUE</div>
                <div class="bar-bg"><div class="bar-fill" id="fatigue-bar" style="width: 20%;"></div></div>
            </div>
            <div class="best-score-line">
                <button type="button" class="rank-trigger" id="rank-btn" title="랭킹 보기">🏆 BEST <span id="home-best-score">0</span></button>
                <span class="form-pill" id="home-form-name">🐶 아기 망고</span>
            </div>
        </div>

        <div class="bubble" id="status-bubble">YUMMY!</div>
        <div class="zzz" id="zzz-icon">Zzz...</div>

        <div id="home-mango">
            <svg id="home-mango-svg" class="mango-pixel walking" viewBox="0 -3 24 26" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <!-- 간식 선택 팝업 -->
        <div class="screen-modal" id="food-modal" style="display:none;">
            <div class="modal-header">
                <span>🍖 FOOD &amp; SNACKS</span>
                <button type="button" class="modal-close" id="close-food-btn">X</button>
            </div>
            <div class="modal-list" id="food-list"></div>
        </div>

        <!-- 상점 팝업 -->
        <div class="screen-modal" id="shop-modal" style="display:none;">
            <div class="modal-header">
                <span>🛒 PET SHOP</span>
                <span class="modal-coins">🪙 <span id="shop-coin-display">0</span></span>
                <button type="button" class="modal-close" id="close-shop-btn">X</button>
            </div>
            <div class="shop-tabs" id="shop-tabs">
                <button type="button" class="shop-tab active" data-tab="snack">간식</button>
                <button type="button" class="shop-tab" data-tab="accessory">꾸미기</button>
                <button type="button" class="shop-tab" data-tab="theme">배경</button>
            </div>
            <div class="modal-list" id="shop-list"></div>
        </div>

        <!-- 캐릭터 선택 팝업 (망고 / 토리) -->
        <div class="screen-modal" id="char-modal" style="display:none;">
            <div class="modal-header">
                <span>🐾 CHARACTER</span>
                <button type="button" class="modal-close" id="close-char-btn">X</button>
            </div>
            <div class="modal-list" id="char-list"></div>
        </div>

        <!-- 도감 팝업 -->
        <div class="screen-modal" id="dex-modal" style="display:none;">
            <div class="modal-header">
                <span>📖 PET DEX</span>
                <span class="modal-coins" id="dex-count-display">1/6</span>
                <button type="button" class="modal-close" id="close-dex-btn">X</button>
            </div>
            <div class="dex-care-summary" id="dex-care-summary"></div>
            <div class="modal-list" id="dex-list"></div>
            <div class="dex-footer" id="dex-footer" style="display:none;">
                <button type="button" class="mini-action-btn primary" id="rebirth-btn">🥚 새로 키우기 (코인·도감 유지)</button>
            </div>
        </div>

        <!-- 미니게임 랭킹 및 닉네임 팝업 -->
        <div class="screen-modal" id="rank-modal" style="display:none;">
            <div class="modal-header">
                <span>🏆 RANKING</span>
                <span class="modal-coins" id="sync-badge">LOCAL</span>
                <button type="button" class="modal-close" id="close-rank-btn">X</button>
            </div>
            <div class="nickname-row">
                <input type="text" id="nickname-input" class="nickname-input" maxlength="12" placeholder="닉네임 입력">
                <button type="button" class="item-btn" id="save-nickname-btn">저장</button>
            </div>
            <div class="modal-list" id="rank-list"></div>
        </div>

        <div class="ground"></div>
    </div>

    <!-- 미니게임 화면 -->
    <div id="game-screen" class="screen theme-default">
        <div class="game-hud">
            <div class="hud-left">
                <div class="score-board" id="score-display">SCORE 0000</div>
                <div class="combo-badge" id="combo-badge"></div>
            </div>
            <div class="hud-right">
                <div class="time-board" id="time-display">60s</div>
                <div class="hearts-board" id="hearts-display">❤️❤️❤️</div>
            </div>
        </div>

        <div class="game-guide" id="game-guide">
            CATCH BALLS!<br>
            60s / ❤️❤️❤️<br><br>
            PRESS [PLAY/STOP]<br>TO START
        </div>

        <!-- 미니게임 결과 모달 -->
        <div class="screen-modal game-result-modal" id="game-result" style="display:none;">
            <div class="result-title" id="result-title">TIME UP!</div>
            <div class="result-details" id="result-details"></div>
            <div class="result-actions">
                <button type="button" class="mini-action-btn primary" id="result-replay-btn">RETRY</button>
                <button type="button" class="mini-action-btn" id="result-home-btn">HOME</button>
            </div>
        </div>

        <div id="game-mango">
            <svg id="game-mango-svg" class="mango-pixel" viewBox="0 -3 24 26" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="ground"></div>
    </div>

    <!-- 홈 버튼 -->
    <div class="buttons" id="home-buttons">
        <div class="btn btn-food" id="btn-food">
            <div class="btn-icon">🍖</div>
            <div>FOOD</div>
        </div>
        <div class="btn btn-play" id="btn-play">
            <div class="btn-icon">⚽</div>
            <div>PLAY</div>
        </div>
        <div class="btn btn-sleep" id="btn-sleep">
            <div class="btn-icon">💤</div>
            <div>SLEEP</div>
        </div>
        <div class="btn btn-outside" id="btn-outside">
            <div class="btn-icon">🌳</div>
            <div>OUTSIDE</div>
        </div>
    </div>

    <!-- 미니게임 버튼 -->
    <div class="buttons" id="game-buttons" style="display:none;">
        <div class="btn btn-food" id="btn-left">
            <div class="btn-icon">&lt;</div>
        </div>
        <div class="btn btn-play" id="btn-right">
            <div class="btn-icon">&gt;</div>
        </div>
        <div class="btn btn-sleep" id="btn-toggle-game">
            <div>PLAY<br>STOP</div>
        </div>
        <div class="btn btn-outside" id="btn-go-home">
            <div class="btn-icon">🏠</div>
            <div>GO HOME</div>
        </div>
    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/data.js"></script>
<script defer src="js/sprites.js"></script>
<script defer src="js/sound.js"></script>
<script defer src="js/supabase-config.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/minigame.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
